<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>保健 振り返り小テスト</title>
<style>
:root{--bg:#fff;--fg:#222;--card:#f2f5fa;--line:#c9d3e3;--main:#1f3a5f;--ok:#1b7f4b;--ng:#c0392b;--btn:#1f3a5f;--btnfg:#fff;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#14181f;--fg:#eceff4;--card:#1f2630;--line:#38445a;--main:#9ec1f0;--ok:#5ad08f;--ng:#ff8a7a;--btn:#9ec1f0;--btnfg:#14181f}}
:root[data-theme="dark"]{--bg:#14181f;--fg:#eceff4;--card:#1f2630;--line:#38445a;--main:#9ec1f0;--ok:#5ad08f;--ng:#ff8a7a;--btn:#9ec1f0;--btnfg:#14181f}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--fg);font:18px/1.7 "Hiragino Sans","Yu Gothic",sans-serif}
main{max-width:760px;margin:0 auto;padding:16px}
h1{font-size:26px;color:var(--main);margin:8px 0}
.tabs{display:flex;flex-wrap:wrap;gap:8px;margin:12px 0}
.tabs button{flex:1 1 45%;padding:12px;font-size:19px;border:2px solid var(--main);background:var(--bg);color:var(--main);border-radius:12px;font-weight:700}
.tabs button.on{background:var(--btn);color:var(--btnfg)}
input[type=text],textarea{width:100%;box-sizing:border-box;font:inherit;padding:10px;border:2px solid var(--line);border-radius:10px;background:var(--bg);color:var(--fg)}
.q{background:var(--card);border-radius:14px;padding:14px;margin:14px 0;overflow-wrap:anywhere}
.q.miss{outline:3px solid var(--ng)}
.q h2{font-size:19px;margin:0 0 8px}
.q h2 b{color:var(--main)}
.opt{display:block;padding:12px;margin:6px 0;border:2px solid var(--line);border-radius:10px;background:var(--bg);cursor:pointer}
.opt input{margin-right:8px;transform:scale(1.3)}
.row{display:flex;gap:8px}.row .opt{flex:1;text-align:center}
.wl{display:block;margin:6px 0 2px;font-weight:700;color:var(--main)}
.fb{margin-top:8px;font-weight:700}.fb.ok{color:var(--ok)}.fb.ng{color:var(--ng)}
.ex{font-size:16px;margin-top:4px}
button.main{width:100%;padding:16px;font-size:20px;font-weight:700;border:0;border-radius:12px;background:var(--btn);color:var(--btnfg);margin:8px 0}
button.sub{background:var(--bg);color:var(--main);border:2px solid var(--main)}
#warn{display:none;color:var(--ng);font-weight:700;margin:8px 0}
#res{display:none;background:var(--card);border-radius:14px;padding:14px;margin:14px 0;border:2px solid var(--main)}
#score{font-size:32px;font-weight:700;color:var(--main)}
</style>
</head>
<body>
<main>
<h1>保健　振り返り小テスト</h1>
<div class="tabs" id="tabs"></div>
<label>名前(クラス・番号も)<input type="text" id="nm" placeholder="例:1年2組 15番 山田太郎"></label>
<div id="qs"></div>
<div id="warn"></div>
<button class="main" id="go">答え合わせをする</button>
<div id="res">
<div id="score"></div>
<p id="note"></p>
<p>先生に出すときは、下の文章をコピーして、クラスルームに貼ってください。</p>
<textarea id="out" rows="8" readonly></textarea>
<button class="main" id="cp">結果をコピーする</button>
<button class="main sub" id="rt">もう一度やる</button>
</div>
</main>

let cur='alc';
const ST={};
const $=i=>document.getElementById(i);
/* ひらがな/カタカナ・全角/半角をそろえ、空白とかっこを取る */
const norm=s=>(s||'').normalize('NFKC').replace(/[\s()]/g,'').replace(/[ァ-ヶ]/g,c=>String.fromCharCode(c.charCodeAt(0)-0x60)).toLowerCase();
const shuf=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};
const newOrd=u=>D[u].q.map(q=>q.k=='c'?shuf(q.o.map((_,i)=>i)):null);
function S(u){if(!ST[u])ST[u]={ans:{},graded:false,n:0,first:null,ord:newOrd(u)};return ST[u]}
const nq=q=>q.k=='w'?(q.n||1):1;

/* いまの画面の答えを、単元の記録に保存する */
function save(){
 const s=S(cur);s.ans={};
 D[cur].q.forEach((q,i)=>{
  if(q.k=='c'||q.k=='t'){const r=document.querySelector('input[name=a'+i+']:checked');s.ans[i]=r?+r.value:null}
  else if(q.k=='w'&&nq(q)==2)s.ans[i]=[$('a'+i+'_0').value,$('a'+i+'_1').value];
  else s.ans[i]=$('a'+i).value;});}
const empty=v=>v===null||v===undefined||(Array.isArray(v)?v.some(x=>!x.trim()):typeof v==='string'&&!v.trim());

function render(){
 const s=S(cur);
 $('warn').style.display='none';$('res').style.display='none';$('go').style.display='';
 $('tabs').innerHTML=Object.keys(D).map(k=>'<button data-k="'+k+'" class="'+(k==cur?'on':'')+'">'+D[k].t+'</button>').join('');
 $('qs').innerHTML=D[cur].q.map((q,i)=>{
  let b='<div class="q" id="q'+i+'"><h2><b>問'+(i+1)+'</b>　'+q.q+'</h2>';
  if(q.k=='c')b+=s.ord[i].map((o,j)=>'<label class="opt"><input type="radio" name="a'+i+'" value="'+o+'">'+MK[j]+'　'+q.o[o]+'</label>').join('');
  if(q.k=='t')b+='<div class="row">'+TF.map((o,j)=>'<label class="opt"><input type="radio" name="a'+i+'" value="'+j+'">'+o+'</label>').join('')+'</div>';
  if(q.k=='f')b+='<input type="text" id="a'+i+'" placeholder="答えを入力" autocomplete="off">';
  if(q.k=='w'&&nq(q)==2)b+=[0,1].map(j=>'<label class="wl" for="a'+i+'_'+j+'">'+CN[j]+'</label><textarea id="a'+i+'_'+j+'" rows="2" placeholder="自分のことばで書きましょう"></textarea>').join('');
  if(q.k=='w'&&nq(q)==1)b+='<textarea id="a'+i+'" rows="4" placeholder="自分のことばで書きましょう"></textarea>';
  return b+'<div class="fb" id="f'+i+'"></div></div>';}).join('');
 /* 保存してある答えをもどす */
 D[cur].q.forEach((q,i)=>{
  const v=s.ans[i];if(v===undefined||v===null)return;
  if(q.k=='c'||q.k=='t'){const r=document.querySelector('input[name=a'+i+'][value="'+v+'"]');if(r)r.checked=true}
  else if(q.k=='w'&&nq(q)==2){$('a'+i+'_0').value=v[0];$('a'+i+'_1').value=v[1]}
  else $('a'+i).value=v;});
 if(s.graded)showResult();
}

function result(){
 const s=S(cur);let sc=0,tot=0;const lines=[],fb=[];
 D[cur].q.forEach((q,i)=>{
  const v=s.ans[i];
  if(q.k=='w'){lines.push('－');fb.push({w:true,html:'<div class="ex">例:'+q.s+'<br>(先生が採点します。自分の答えとくらべてみよう)</div>'});return}
  tot+=10;
  const ok=q.k=='f'?q.a.map(norm).includes(norm(v)):v===q.a;
  lines.push(ok?'○':'×');if(ok)sc+=10;
  const right=q.k=='c'?MK[s.ord[i].indexOf(q.a)]+'　'+q.o[q.a]:q.k=='t'?TF[q.a]:q.s;
  fb.push({ok:ok,html:(ok?'○ 正解!':'× 正解は「'+right+'」')+'<div class="ex">'+q.e+'</div>'});});
 return{sc,tot,lines,fb};}

function showResult(){
 const s=S(cur),r=result();
 r.fb.forEach((x,i)=>{const f=$('f'+i);f.className='fb'+(x.w?'':(x.ok?' ok':' ng'));f.innerHTML=x.html});
 document.querySelectorAll('#qs input,#qs textarea').forEach(e=>e.disabled=true);
 const wi=D[cur].q.findIndex(q=>q.k=='w'),wq=D[cur].q[wi],wv=s.ans[wi];
 const wt=nq(wq)==2?'①'+wv[0]+'\n②'+wv[1]:wv;
 $('score').textContent=r.sc+' / '+r.tot+' 点';
 $('note').textContent='記述の問'+(wi+1)+'は、先生が採点します。';
 $('out').value='【保健 小テスト】'+D[cur].t+'\n名前:'+($('nm').value||'(未入力)')+'\n回数:'+s.n+'回目\n1回目の点数:'+s.first+' / '+r.tot+'点\n今回の自動採点:'+r.sc+' / '+r.tot+'点\n問'+(wi+1)+'(記述):\n'+wt+'\n正誤:'+r.lines.join('');
 $('res').style.display='block';$('go').style.display='none';
}

$('go').onclick=()=>{
 save();
 const s=S(cur),miss=[];
 D[cur].q.forEach((q,i)=>{if(empty(s.ans[i]))miss.push(i)});
 document.querySelectorAll('.q').forEach(e=>e.classList.remove('miss'));
 D[cur].q.forEach((q,i)=>{const f=$('f'+i);if(f.dataset.miss){f.textContent='';f.className='fb';delete f.dataset.miss}});
 if(miss.length){
  const w=$('warn');w.textContent='問'+miss.map(i=>i+1).join('・問')+'がまだです。答えてから、もう一度「答え合わせをする」を押してね。';w.style.display='block';
  miss.forEach(i=>{$('q'+i).classList.add('miss');const f=$('f'+i);f.className='fb ng';f.textContent='まだ答えていません';f.dataset.miss='1'});
  $('q'+miss[0]).scrollIntoView({behavior:'smooth',block:'center'});
  return;}
 $('warn').style.display='none';
 const r=result();
 s.n++;if(s.n==1)s.first=r.sc;
 s.graded=true;showResult();
 $('res').scrollIntoView({behavior:'smooth'});};

/* 答えを入れたら、「まだです」の表示を消す */
$('qs').addEventListener('input',e=>{const q=e.target.closest('.q');if(!q)return;q.classList.remove('miss');const f=q.querySelector('.fb');if(f&&f.dataset.miss){f.textContent='';f.className='fb';delete f.dataset.miss}});
$('qs').addEventListener('change',e=>{const q=e.target.closest('.q');if(!q)return;q.classList.remove('miss');const f=q.querySelector('.fb');if(f&&f.dataset.miss){f.textContent='';f.className='fb';delete f.dataset.miss}});

$('cp').onclick=async()=>{
 const t=$('out');
 try{await navigator.clipboard.writeText(t.value);$('cp').textContent='コピーしました'}
 catch(e){t.removeAttribute('readonly');t.focus();t.select();$('cp').textContent='文章を選択しました。「コピー」を押してください'}
 setTimeout(()=>{$('cp').textContent='結果をコピーする'},3000)};
$('rt').onclick=()=>{const s=S(cur);s.ans={};s.graded=false;s.ord=newOrd(cur);render();window.scrollTo({top:0,behavior:'smooth'})};
$('tabs').onclick=e=>{const b=e.target.closest('button');if(!b||b.dataset.k==cur)return;save();cur=b.dataset.k;render()};
render();
</script>
</body>
</html>
